on:
  pull_request:
    paths:
      - "terraform/**"
      - "flake.nix"
      - "modules/devices.nix"
      - "scripts/terraform-ci.sh"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

concurrency:
  group: terraform
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  terraform:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.INPUTS_TOKEN }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - uses: shaneplunkett/workflows/tailnet@v1.9.0
        with:
          client-id: ${{ vars.TAILSCALE_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_AUDIENCE }}

      - name: Write the credentials
        env:
          TERRAFORM_CLOUD_TOKEN: ${{ secrets.TERRAFORM_CLOUD_TOKEN }}
          TERRAFORM_HCLOUD_TOKEN: ${{ secrets.TERRAFORM_HCLOUD_TOKEN }}
          TERRAFORM_CLOUDFLARE_TOKEN: ${{ secrets.TERRAFORM_CLOUDFLARE_TOKEN }}
          TERRAFORM_ACCESS_EMAILS: ${{ secrets.TERRAFORM_ACCESS_EMAILS }}
          TERRAFORM_FORGEJO_TOKEN: ${{ secrets.TERRAFORM_FORGEJO_TOKEN }}
          TERRAFORM_UNIFI_TOKEN: ${{ secrets.TERRAFORM_UNIFI_TOKEN }}
          TERRAFORM_INCUS_KEY: ${{ secrets.TERRAFORM_INCUS_KEY }}
        run: |
          creds="$RUNNER_TEMP/terraform-credentials"
          install -d -m 700 "$creds"
          for name in cloud-token hcloud-token cloudflare-token access-emails forgejo-token unifi-token incus-key; do
            var="TERRAFORM_${name//-/_}"
            var="${var^^}"
            test -n "${!var}" || { echo "::error::$var is not set"; exit 1; }
            printf '%s' "${!var}" > "$creds/terraform-$name"
          done
          echo "TERRAFORM_CREDENTIALS=$creds" >> "$GITHUB_ENV"

      - name: Plan
        run: scripts/terraform-ci.sh plan

      - name: Post the plan on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- terraform-plan -->'
          summary="$(grep -E '^(Plan:|No changes\.)' terraform/plan.txt || echo 'See the full plan.')"
          plan="$(cat terraform/plan.txt)"
          if [ "${#plan}" -gt 60000 ]; then
            plan="${plan:0:60000}
          ...cut short, since a comment holds 65,536 characters. The run's log has the rest."
          fi
          body="$marker
          ### Terraform plan

          **$summary**

          <details>
          <summary>Full plan</summary>

          ~~~
          $plan
          ~~~

          </details>"
          id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" -f body="$body" > /dev/null
          fi
