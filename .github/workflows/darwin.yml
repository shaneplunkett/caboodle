on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"

concurrency:
  group: darwin
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, darwin]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the Macs and push them to the cache
        run: scripts/push-to-cache.sh mini macbook macbook-air
