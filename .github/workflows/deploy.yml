on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"

concurrency:
  group: deploy
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, homelab]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build every Linux host
        id: build
        env:
          CLOSURE_LINKS: ${{ runner.temp }}/closures
        run: |
          hosts="$(scripts/build-linux-hosts.sh)"
          echo "hosts=$hosts" >> "$GITHUB_OUTPUT"
      - name: Push every closure to the cache
        run: scripts/push-to-cache.sh ${{ steps.build.outputs.hosts }}
      - name: Apply the servers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: scripts/deploy.sh
      - name: Let the runner's garbage collection have the closures
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/closures"
