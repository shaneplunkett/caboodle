on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write

jobs:
  check:
    uses: shaneplunkett/workflows/.github/workflows/check.yml@v2.3.0
    with:
      tailnet-client-id: ${{ vars.TAILSCALE_CLIENT_ID }}
      tailnet-audience: ${{ vars.TAILSCALE_AUDIENCE }}
      cache-endpoint: http://cache.tail1d49f8.ts.net:8080
      cache-name: shane
      cache-public-key: shane:T+Jq4M4cvkVyJwM7k5/zbOevaD1vfXzoqVX9a2hXCZI=
      extra-substituters: >-
        https://nix-community.cachix.org
        https://noctalia.cachix.org
        https://cache.numtide.com
      extra-trusted-public-keys: >-
        nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
        noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4=
        niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
