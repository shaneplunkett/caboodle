on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write

jobs:
  check:
    uses: shaneplunkett/workflows/.github/workflows/check.yml@metrokitten/sha-285-the-check-caches-its-dev-shell-in-githubs-actions-cache
    secrets:
      INPUTS_TOKEN: ${{ secrets.INPUTS_TOKEN }}
