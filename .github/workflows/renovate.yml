on:
  schedule:
    - cron: "47 10 * * *"
  workflow_dispatch:
    inputs:
      now:
        description: Open the weekly pull requests now instead of on Saturday night
        type: boolean
        default: false

concurrency:
  group: renovate
  cancel-in-progress: false

permissions: {}

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            caboodle
            ai-skills
            nix-config-private
            noctalia-plugins
            vex-brain
            wallpapers
          permission-checks: read
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
          permission-vulnerability-alerts: read
          permission-workflows: write
      - uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        with:
          token: ${{ steps.app.outputs.token }}
        env:
          RENOVATE_CONFIG: |
            {
              "autodiscover": true,
              "autodiscoverFilter": ["shaneplunkett/caboodle"],
              "onboarding": false,
              "forkProcessing": "enabled",
              "platformCommit": "enabled",
              "minimumReleaseAge": "1 day",
              "lockFileMaintenance": { "minimumReleaseAge": null },
              "schedule": ["after 8pm on saturday", "before 9am on sunday"],
              "timezone": "Australia/Melbourne",
              "force": ${{ inputs.now && '{ "schedule": ["at any time"] }' || '{}' }}
            }
