on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: hosts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  hosts:
    uses: shaneplunkett/workflows/.github/workflows/hosts.yml@derivation-diff-on-github
    secrets:
      INPUTS_TOKEN: ${{ secrets.INPUTS_TOKEN }}
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
