on:
  push:

concurrency:
  group: hosts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.list.outputs.hosts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.INPUTS_TOKEN }}
      - name: List every host
        id: list
        run: |
          hosts="$(nix eval --json .#hydraJobs --apply builtins.attrNames)"
          echo "hosts=$hosts" >> "$GITHUB_OUTPUT"

  evaluate:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.list.outputs.hosts) }}
    env:
      HOST: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reclaim disk
        run: |
          echo "BEFORE=$(df -h --output=avail / | tail -1 | tr -d ' ')" >> "$GITHUB_ENV"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null
          echo "AFTER=$(df -h --output=avail / | tail -1 | tr -d ' ')" >> "$GITHUB_ENV"
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.INPUTS_TOKEN }}
      - name: Evaluate
        run: |
          out="$(mktemp -d)"
          status=0
          /usr/bin/time -f '%M %e' -o "$out/stats" \
            nix eval --raw ".#hydraJobs.$HOST.drvPath" > "$out/drv" || status=$?
          read -r rss elapsed < <(tail -1 "$out/stats")
          peak="$(awk -v kb="$rss" 'BEGIN { printf "%.2f GiB", kb / 1048576 }')"
          if [ "$status" -eq 0 ]; then
            drv="\`$(< "$out/drv")\`"
          else
            drv="evaluation failed with status $status"
          fi
          echo "$HOST $drv peak $peak elapsed ${elapsed}s free $BEFORE -> $AFTER"
          {
            echo "### $HOST"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Derivation | $drv |"
            echo "| Peak memory | $peak |"
            echo "| Elapsed | ${elapsed}s |"
            echo "| Free on \`/\` before reclaiming | $BEFORE |"
            echo "| Free on \`/\` after reclaiming | $AFTER |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
