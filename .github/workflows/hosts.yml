on:
  push:

concurrency:
  group: hosts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.list.outputs.hosts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.INPUTS_TOKEN }}
      - name: List every host
        id: list
        run: echo "hosts=$(nix eval --json .#hydraJobs --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"

  evaluate:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.list.outputs.hosts) }}
    env:
      HOST: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free space before reclaiming
        run: echo "BEFORE=$(df -h --output=avail / | tail -1 | tr -d ' ')" >> "$GITHUB_ENV"
      - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
      - name: Free space after reclaiming
        run: echo "AFTER=$(df -h --output=avail /nix | tail -1 | tr -d ' ')" >> "$GITHUB_ENV"
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.INPUTS_TOKEN }}
          extra_nix_config: |
            build-dir = /nix/build
      - name: Evaluate
        run: |
          out="$(mktemp -d)"
          /usr/bin/time -f '%M %e' -o "$out/stats" \
            nix eval --raw ".#hydraJobs.$HOST.drvPath" > "$out/drv"
          read -r rss elapsed < "$out/stats"
          peak="$(awk -v kb="$rss" 'BEGIN { printf "%.2f GiB", kb / 1048576 }')"
          drv="$(< "$out/drv")"
          ending="$(df -h --output=avail /nix | tail -1 | tr -d ' ')"
          echo "$HOST $drv peak $peak elapsed ${elapsed}s free $BEFORE -> $AFTER -> $ending"
          {
            echo "### $HOST"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Derivation | \`$drv\` |"
            echo "| Peak memory | $peak |"
            echo "| Elapsed | ${elapsed}s |"
            echo "| Free for \`/nix\` before reclaiming | $BEFORE |"
            echo "| Free on \`/nix\` after reclaiming | $AFTER |"
            echo "| Free on \`/nix\` after evaluating | $ending |"
          } >> "$GITHUB_STEP_SUMMARY"
