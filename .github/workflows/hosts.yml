on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: hosts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  hosts:
    uses: shaneplunkett/workflows/.github/workflows/hosts.yml@sha-279
    with:
      build: true
      tailnet-client-id: ${{ vars.TAILSCALE_CLIENT_ID }}
      tailnet-audience: ${{ vars.TAILSCALE_AUDIENCE }}
      cache-endpoint: http://cache.tail1d49f8.ts.net:8080
      cache-name: shane
      cache-public-key: shane:T+Jq4M4cvkVyJwM7k5/zbOevaD1vfXzoqVX9a2hXCZI=
    secrets:
      INPUTS_TOKEN: ${{ secrets.INPUTS_TOKEN }}
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      ATTIC_PULL_TOKEN: ${{ secrets.ATTIC_PULL_TOKEN }}
      ATTIC_PUSH_TOKEN: ${{ secrets.ATTIC_PUSH_TOKEN }}
