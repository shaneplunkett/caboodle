on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/tailnet.yml"

permissions:
  contents: read
  id-token: write

jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: shaneplunkett/workflows/tailnet@tailnet-action
        with:
          client-id: ${{ vars.TAILSCALE_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_AUDIENCE }}
      - name: Show the runner's node and its tag
        run: tailscale status --json | jq '.Self | {HostName, Tags}'
      - name: Reach atticd over the tailnet, which refuses a request without a token
        run: |
          code=$(curl -sS --retry 5 --retry-delay 3 -m 20 -o /dev/null -w '%{http_code}' \
            http://cache.tail1d49f8.ts.net:8080/shane/nix-cache-info)
          echo "atticd answered $code"
          test "$code" = 401
      - name: Reach sshd on dns1 over the tailnet
        run: timeout 30 bash -c 'exec 3<>/dev/tcp/dns1.tail1d49f8.ts.net/22 && head -1 <&3'
