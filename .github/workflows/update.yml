on:
  schedule:
    # Friday 22:30 Melbourne (21:30 outside daylight saving), ready for
    # Saturday, and half an hour after the forge's own update, whose push
    # would otherwise mirror over and close this one straight away.
    - cron: "30 11 * * 5"
  workflow_dispatch:

concurrency:
  group: flake-update
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    uses: shaneplunkett/workflows/.github/workflows/flake-update.yml@sha-275
    with:
      title: "throwaway: SHA-275 flake update proof (do not merge)"
      branch: update-github/throwaway-sha-275
      reviewer: ""
      notes: scripts/flake-update-notes.sh
    secrets:
      INPUTS_TOKEN: ${{ secrets.INPUTS_TOKEN }}
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
