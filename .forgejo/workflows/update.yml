on:
  schedule:
    - cron: "0 11 * * 5" # Friday 22:00 Melbourne (21:00 outside daylight saving), ready for Saturday
  workflow_dispatch:

concurrency:
  group: flake-update
  cancel-in-progress: true

jobs:
  update:
    uses: shane/workflows/.forgejo/workflows/flake-update.yml@v1.5.0
    with:
      title: "flake.lock: update every unpinned input"
      notes: scripts/flake-update-notes.sh
