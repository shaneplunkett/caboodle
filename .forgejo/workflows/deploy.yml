on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: nix
    steps:
      - uses: https://git.shaneplunkett.com/shane/workflows/checkout@v1.6.0
        with:
          fetch-depth: 0
      - name: Apply, if this push changed terraform/, proxmox/, flake.nix or modules/devices.nix
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2> /dev/null \
            && git diff --quiet "$BEFORE" HEAD -- terraform proxmox flake.nix modules/devices.nix; then
            echo "Nothing in terraform/, proxmox/, flake.nix or modules/devices.nix changed, so there's nothing to apply."
            exit 0
          fi
          scripts/terraform-ci.sh apply

  deploy:
    needs: terraform
    runs-on: nix
    steps:
      - uses: https://git.shaneplunkett.com/shane/workflows/checkout@v1.6.0
      - run: colmena apply --on builder
      - run: colmena apply --on @deploy-on-merge

  deploy-dns2:
    needs: deploy
    runs-on: nix
    steps:
      - uses: https://git.shaneplunkett.com/shane/workflows/checkout@v1.6.0
      - name: Wait for dns1 to answer
        run: |
          dns1=$(colmena eval -E '{ nodes, ... }: nodes.dns1.config.homelab.lanAddress' | jq -r .)
          for name in git.shaneplunkett.com data.forgejo.org; do
            for attempt in $(seq 30); do
              if nix shell --inputs-from . nixpkgs#dig --command \
                dig +short +time=2 +tries=1 "@$dns1" "$name" A | grep -q '^[^;]'; then
                echo "dns1 answers $name"
                continue 2
              fi
              sleep 2
            done
            echo "dns1 isn't answering $name, so dns2 keeps its current config"
            exit 1
          done
      - run: colmena apply --on @deploy-after-dns1

  terraform-secrets:
    needs: deploy
    runs-on: nix
    steps:
      - uses: https://git.shaneplunkett.com/shane/workflows/checkout@v1.6.0
        with:
          fetch-depth: 0
      - name: Apply again, if this push changed a Terraform secret
        env:
          BEFORE: ${{ github.event.before }}
          CREDS: /run/credentials/forgejo-runner-builder.service
        run: |
          if ! git cat-file -e "$BEFORE^{commit}" 2> /dev/null \
            || git diff --quiet "$BEFORE" HEAD -- 'modules/agenix/terraform-*.age'; then
            echo "This push didn't change a Terraform secret, so the first apply had them all."
            exit 0
          fi
          if [ ! "$CREDS" -nt /run/agenix ]; then
            echo "This job ran on the runner from before the deploy, which still has the old secrets. Re-run it once the runner has restarted."
            exit 1
          fi
          scripts/terraform-ci.sh apply
